name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci installe exactement ce que décrit package-lock.json,
      # contrairement à npm install qui peut mettre à jour des versions.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck

      - name: Typecheck front
        run: npx tsc -p tsconfig.front.json

      - name: Build
        run: npm run build

      # Les tests ne touchent ni MySQL ni Mongo : la route testée n'en a pas
      # besoin, et les services démarrent en mode paresseux.
      - name: Test
        run: npm test
